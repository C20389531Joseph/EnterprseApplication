<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artworks Management App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      text-align: center;
    }
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      margin: 2px;
      cursor: pointer;
      color: white;
    }
    .btn-add {
      background-color: #007bff;
    }
    .btn-update {
      background-color: #17a2b8;
    }
    .btn-delete {
      background-color: #dc3545;
    }
    .btn-view {
      background-color: #28a745;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #343a40;
      color: white;
    }
  </style>
  <script>
    async function fetchItems() {
      const res = await fetch('/api/items');
      const data = await res.json();
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      data.forEach(item => {
        const row = `
          <tr>
            <td>${item.Title || ''}</td>
            <td>${item.Artist ? item.Artist.join(', ') : ''}</td>
            <td>${item.Date || ''}</td>
            <td>${item.Medium || ''}</td>
            <td>
              <button class="btn btn-update" onclick="updateItem(${item.ObjectID})">Update</button>
              <button class="btn btn-delete" onclick="deleteItem(${item.ObjectID})">Delete</button>
              <button class="btn btn-view" onclick="viewItem(${item.ObjectID})">View</button>
            </td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    async function addItem() {
      const newItem = {
        Title: "New Artwork",
        Artist: ["New Artist"],
        ObjectID: Math.floor(Math.random() * 100000),
        Date: "2025",
        Medium: "Mixed media"
      };
      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newItem)
      });
      fetchItems();
    }

    async function updateItem(id) {
      const newTitle = prompt("Enter new Title:");
      if (newTitle) {
        await fetch('/api/items/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ Title: newTitle })
        });
        fetchItems();
      }
    }

    async function deleteItem(id) {
      if (confirm('Are you sure you want to delete this artwork?')) {
        await fetch('/api/items/' + id, { method: 'DELETE' });
        fetchItems();
      }
    }

    async function viewItem(id) {
      const res = await fetch('/api/items');
      const data = await res.json();
      const item = data.find(item => item.ObjectID === id);
      if (item) {
        alert(`Title: ${item.Title}\nArtist: ${item.Artist}\nDate: ${item.Date}\nMedium: ${item.Medium}`);
      }
    }

    window.onload = fetchItems;
  </script>
</head>
<body>

  <h1>Artworks Management App</h1>
  <button class="btn btn-add" onclick="addItem()">Add Artwork</button>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Artist</th>
        <th>Date</th>
        <th>Medium</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Populated by JavaScript -->
    </tbody>
  </table>

</body>
</html>
